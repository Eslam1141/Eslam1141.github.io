<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="RepVane logo">
  <!-- Simplified variant for sizes <= 32px (favicon-16/32, tab bar): the 12-tick ring collapses
       into mush at this size, so it reduces to a bold full ring (dim ink) + a bold accent arc
       over the same top-right span. The needle keeps two bold plate bumps (a stubby dumbbell
       bar) so the concept still reads even at 16px, with the accent tip poking past the far one. -->
  <rect width="100" height="100" rx="22" ry="22" fill="#F3F0E8"/>
  <circle cx="50" cy="50" r="36.5" fill="none" stroke="#14161B" stroke-opacity="0.22" stroke-width="8"/>
  <path d="M 31.75 18.39 A 36.5 36.5 0 0 1 86.5 50" fill="none" stroke="#0B7A75" stroke-width="8" stroke-linecap="round"/>
  <line x1="42.93" y1="57.07" x2="68.38" y2="31.62" stroke="#14161B" stroke-width="7" stroke-linecap="round"/>
  <circle cx="42.93" cy="57.07" r="8.5" fill="#14161B"/>
  <circle cx="68.38" cy="31.62" r="8.5" fill="#14161B"/>
  <polygon points="80.5,19.5 66.5,27 73.5,36" fill="#0B7A75"/>
  <circle cx="50" cy="50" r="6.5" fill="#0B7A75"/>
</svg>
