<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="RepVane logo">
  <!-- RepVane "Dial Vane" mark: 12-tick rep-counter ring + dumbbell-arrow needle (NE), pivot dot.
       Grid: 100x100, center (50,50). Ring ticks at Ro=41/Ri=32. Needle tail SW (dumbbell plates),
       head NE (arrowhead). Colors: paper #F3F0E8, ink #14161B, accent teal #0B7A75. -->
  <rect width="100" height="100" rx="22" ry="22" fill="#F3F0E8"/>

  <g stroke-linecap="round" fill="none">
    <!-- ink ticks @ 22% opacity (7) -->
    <g stroke="#14161B" stroke-opacity="0.22" stroke-width="5.2">
      <line x1="77.71" y1="66"   x2="85.51" y2="70.5"/>
      <line x1="66"    y1="77.71" x2="70.5" y2="85.51"/>
      <line x1="50"    y1="82"   x2="50"    y2="91"/>
      <line x1="34"    y1="77.71" x2="29.5" y2="85.51"/>
      <line x1="22.29" y1="66"   x2="14.49" y2="70.5"/>
      <line x1="18"    y1="50"   x2="9"     y2="50"/>
      <line x1="22.29" y1="34"   x2="14.49" y2="29.5"/>
    </g>
    <!-- accent ticks (5, top-right arc the needle sweeps toward) -->
    <g stroke="#0B7A75" stroke-width="5.2">
      <line x1="34"    y1="22.29" x2="29.5" y2="14.49"/>
      <line x1="50"    y1="18"   x2="50"    y2="9"/>
      <line x1="66"    y1="22.29" x2="70.5" y2="14.49"/>
      <line x1="77.71" y1="34"   x2="85.51" y2="29.5"/>
      <line x1="82"    y1="50"   x2="91"    y2="50"/>
    </g>
  </g>

  <!-- needle = a dumbbell bar (plates on both ends) doubling as the dial's pointer: the accent
       arrow tip pokes out past the NE plate so the whole needle still reads "pointing NE". -->
  <line x1="38.69" y1="61.31" x2="61.31" y2="38.69" stroke="#14161B" stroke-width="4.2" stroke-linecap="round"/>
  <!-- SW dumbbell plates (tail) -->
  <circle cx="38.69" cy="61.31" r="5.4" fill="#14161B"/>
  <circle cx="42.93" cy="57.07" r="3.5" fill="#14161B"/>
  <!-- NE dumbbell plates (head) -->
  <circle cx="61.31" cy="38.69" r="5.4" fill="#14161B"/>
  <circle cx="57.07" cy="42.93" r="3.5" fill="#14161B"/>
  <!-- arrow tip (accent), emerging from the NE plate -->
  <polygon points="71.21,28.79 58.34,35.72 64.28,41.66" fill="#0B7A75"/>
  <!-- pivot dot -->
  <circle cx="50" cy="50" r="4.2" fill="#0B7A75"/>
</svg>
