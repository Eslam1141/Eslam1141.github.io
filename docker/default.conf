server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entrypoints
    location = /index.html          { add_header Cache-Control "no-cache"; }
    location = /service-worker.js   { add_header Cache-Control "no-cache"; }
    location = /manifest.json       { add_header Cache-Control "no-cache"; }

    # config.js is generated at container start under /tmp so the root
    # filesystem can stay read-only.
    location = /config.js {
        alias /tmp/gym-config/config.js;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # Fingerprint-safe static assets
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers (site-wide)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # connect-src must include the gym-be / gym-assistant API origin (progress
    # sync + the AI Coach call are cross-origin from gym-app.cloider.app).
    # media-src covers the onboarding hero's <video> — it's a placeholder
    # asset off cdn.21st.dev today; once it's replaced with a self-hosted
    # clip, drop that origin and let media-src fall back to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://gym-be.cloider.app; img-src 'self' data: https:; media-src 'self' https://cdn.21st.dev; style-src 'self' 'unsafe-inline'; base-uri 'self'" always;

    # SPA fallback for the password-reset link (gym-be emails
    # /?reset_token=... today; auth-email.js also accepts /reset-password
    # ?token=... per the frontend brief) -- there is no /reset-password file,
    # so without this a direct hit 404s instead of opening the app's reset
    # view. nginx drops server-level add_header directives in any location
    # that sets its own, so the security headers above are repeated here.
    location = /reset-password {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://gym-be.cloider.app; img-src 'self' data: https:; media-src 'self' https://cdn.21st.dev; style-src 'self' 'unsafe-inline'; base-uri 'self'" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
