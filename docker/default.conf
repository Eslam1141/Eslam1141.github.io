server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Never cache the entrypoints
    location = /index.html          { add_header Cache-Control "no-cache"; }
    location = /service-worker.js   { add_header Cache-Control "no-cache"; }
    location = /manifest.json       { add_header Cache-Control "no-cache"; }

    # config.js is generated at container start under /tmp so the root
    # filesystem can stay read-only.
    location = /config.js {
        alias /tmp/gym-config/config.js;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
    }

    # Fingerprint-safe static assets
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Security headers (site-wide)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
