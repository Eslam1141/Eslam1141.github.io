# Site-wide security headers. Included at server level AND inside every
# location that sets its own add_header: nginx drops inherited add_header
# directives in any block that declares one, so each such location must
# include this file again.
# connect-src must include the gym-be / gym-assistant API origin (progress
# sync + the AI Coach call are cross-origin). media-src covers the app
# onboarding hero's <video>, a placeholder off cdn.21st.dev; once it is
# self-hosted, drop that origin. The landing page needs only 'self'.
# The app's index.html used to be served WITHOUT this header (its location
# block only set Cache-Control), so two things it relies on were never
# checked: the early-paint inline <script> (allowed by its sha256; update the
# hash if that script changes) and html2canvas from cdnjs (SRI-pinned in the
# tag). Both are allowed here so serving the CSP on the app doesn't break it.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-xU0+t2MQ0irdz961BRaRCjFE8POXGI5KNrlge20+e2o=' https://accounts.google.com https://apis.google.com https://cdnjs.cloudflare.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://gym-be.cloider.app; img-src 'self' data: https:; media-src 'self' https://cdn.21st.dev; style-src 'self' 'unsafe-inline'; base-uri 'self'" always;
