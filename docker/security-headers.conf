# Site-wide security headers. Included at server level AND inside every
# location that sets its own add_header: nginx drops inherited add_header
# directives in any block that declares one, so each such location must
# include this file again.
# connect-src must include the gym-be / gym-assistant API origin (progress
# sync + the AI Coach call are cross-origin). media-src covers the app
# onboarding hero's <video>, a placeholder off cdn.21st.dev; once it is
# self-hosted, drop that origin. The landing page needs only 'self'.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://accounts.google.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://gym-be.cloider.app; img-src 'self' data: https:; media-src 'self' https://cdn.21st.dev; style-src 'self' 'unsafe-inline'; base-uri 'self'" always;
