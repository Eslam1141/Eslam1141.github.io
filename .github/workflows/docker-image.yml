name: gym-ui image
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "ui.js"
      - "coach.js"
      - "chat.js"
      - "sync.js"
      - "calendar.js"
      - "hero-video.js"
      - "metallic-button.js"
      - "styles.css"
      - "service-worker.js"
      - "manifest.json"
      - "config.js"
      - "icons/**"
      - "widgets/**"
      - "web/coach-loading/**"
      - "docker/**"
      - "Dockerfile"
      - ".github/workflows/docker-image.yml"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compute tree SHA
        id: tree-sha
        run: |
          TREE_SHA=$(git rev-parse HEAD^{tree})
          echo "tree_sha=$TREE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/coach-loading/package-lock.json
      - name: Build coach-loading widget and check for drift
        run: |
          cd web/coach-loading
          npm ci
          npm run build
          cd ../..
          ! grep -q "process.env.NODE_ENV" widgets/coach-loading.js || { echo "::error::coach-loading widget shipped a dev React build (process.env.NODE_ENV unresolved)"; exit 1; }
          if [ -n "$(git status --porcelain -- widgets/)" ]; then
            echo "::error::widgets/ is out of date with web/coach-loading/src — run 'npm run build' in web/coach-loading and commit the result."
            git status --porcelain -- widgets/
            git diff -- widgets/
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Login to ghcr.io (for cache check)
        id: ghcr-login-cache
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this tree's image is already cached
        id: cache-check
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          docker buildx imagetools inspect "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA" > /dev/null 2>&1
          echo "exists=$?" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.cache-check.outputs.exists != '0'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: gym-ui:ci
      - name: Smoke
        if: steps.cache-check.outputs.exists != '0'
        run: |
          docker run -d --rm -p 8080:8080 -e GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com --name ui gym-ui:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/healthz | grep -q ok
          curl -fsS localhost:8080/config.js | grep -q ci.apps.googleusercontent.com
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/index.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/missing)" = "404"
          docker rm -f ui
      - name: Smoke (read-only rootfs)
        if: steps.cache-check.outputs.exists != '0'
        run: |
          docker run -d --rm -p 8090:8080 --read-only \
            --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run \
            -e GOOGLE_CLIENT_ID=ro.apps.googleusercontent.com --name uiro gym-ui:ci
          for i in $(seq 1 20); do curl -fsS localhost:8090/healthz && break; sleep 1; done
          curl -fsS localhost:8090/config.js | grep -q ro.apps.googleusercontent.com
          docker rm -f uiro
      - name: Push tree-tagged image (cache for later promotion)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.cache-check.outputs.exists != '0'
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          docker tag gym-ui:ci "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"
          docker push "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"
      - uses: docker/login-action@v4.6.0
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists != '0'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists != '0'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/eslam1141/gym-ui:${{ github.sha }}
            ghcr.io/eslam1141/gym-ui:latest
      - name: Promote cached tree image to release tags
        if: github.ref == 'refs/heads/main' && steps.cache-check.outputs.exists == '0'
        run: |
          TREE_SHA="${{ steps.tree-sha.outputs.tree_sha }}"
          docker buildx imagetools create \
            --tag "ghcr.io/eslam1141/gym-ui:${{ github.sha }}" \
            --tag ghcr.io/eslam1141/gym-ui:latest \
            "ghcr.io/eslam1141/gym-ui:tree-$TREE_SHA"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    steps:
      - uses: azure/setup-kubectl@v5.1.0
      - name: kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      - name: roll gym-ui to the new image
        run: |
          kubectl -n gym set image deploy/gym-gym-ui "gym-ui=ghcr.io/eslam1141/gym-ui:${GITHUB_SHA}"
          kubectl -n gym rollout status deploy/gym-gym-ui --timeout=120s
